<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wondah App Hub</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 15px 30px;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #111;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      font-size: 45px;
      margin-bottom: 5px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    .subtitle {
      color: #777;
      margin-top: 8px;
    }

    .apps {
      max-width: 500px;
      margin: auto;
    }

    .app {
      width: 100%;
      display: flex;
      align-items: center;
      padding: 17px;
      margin: 12px 0;
      border: 0;
      border-radius: 16px;
      background: white;
      color: #111;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      cursor: pointer;
    }

    .icon {
      width: 42px;
      font-size: 27px;
      margin-right: 14px;
    }

    .arrow {
      margin-left: auto;
      color: #999;
      font-size: 22px;
    }

    .app:active {
      transform: scale(0.97);
    }

    .footer {
      text-align: center;
      color: #999;
      font-size: 13px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">🚀</div>
    <h1>Wondah App Hub</h1>
    <div class="subtitle">Your favorite apps in one place</div>
  </div>

  <div class="apps">

    <a class="app" href="https://www.facebook.com">
      <span class="icon">📘</span>
      Facebook
      <span class="arrow">›</span>
    </a>

    <a class="app" href="https://www.youtube.com">
      <span class="icon">▶️</span>
      YouTube
      <span class="arrow">›</span>
    </a>

    <a class="app" href="https://www.tiktok.com">
      <span class="icon">🎵</span>
      TikTok
      <span class="arrow">›</span>
    </a>

    <a class="app" href="https://www.instagram.com">
      <span class="icon">📸</span>
      Instagram
      <span class="arrow">›</span>
    </a>

    <a class="app" href="https://web.whatsapp.com">
      <span class="icon">💬</span>
      WhatsApp Web
      <span class="arrow">›</span>
    </a>

    <a class="app" href="https://x.com">
      <span class="icon">𝕏</span>
      X
      <span class="arrow">›</span>
    </a>

    <a class="app" href="https://www.linkedin.com">
      <span class="icon">💼</span>
      LinkedIn
      <span class="arrow">›</span>
    </a>

    <a class="app" href="https://www.netflix.com">
      <span class="icon">🎬</span>
      Netflix
      <span class="arrow">›</span>
    </a>

    <a class="app" href="https://open.spotify.com">
      <span class="icon">🎧</span>
      Spotify
      <span class="arrow">›</span>
    </a>

    <a class="app" href="https://www.amazon.com">
      <span class="icon">🛒</span>
      Amazon
      <span class="arrow">›</span>
    </a>

    <a class="app" href="https://www.google.com">
      <span class="icon">🔎</span>
      Google
      <span class="arrow">›</span>
    </a>

    <a class="app" href="https://web.telegram.org">
      <span class="icon">✈️</span>
      Telegram Web
      <span class="arrow">›</span>
    </a>

  </div>

  <div class="footer">
    Wondah App Hub
  </div>

  <script>
    if (window.Telegram && Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }
  </script>

</body>
</html>
