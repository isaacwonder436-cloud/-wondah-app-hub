<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wondah App Hub</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f2f4f7;
  text-align: center;
}

h1 {
  margin-top: 10px;
}

p {
  color: #666;
}

.app {
  display: block;
  width: 100%;
  max-width: 450px;
  margin: 12px auto;
  padding: 18px;
  border: none;
  border-radius: 15px;
  background: white;
  font-size: 18px;
  font-weight: bold;
  text-align: left;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.app:active {
  transform: scale(.97);
}
</style>
</head>

<body>

<h1>🚀 Wondah App Hub</h1>

<p>Choose an app</p>

<button class="app"
onclick="openApp('https://www.facebook.com')">
📘 Facebook
</button>

<button class="app"
onclick="openApp('https://www.youtube.com')">
▶️ YouTube
</button>

<button class="app"
onclick="openApp('https://www.tiktok.com')">
🎵 TikTok
</button>

<button class="app"
onclick="openApp('https://www.instagram.com')">
📸 Instagram
</button>

<button class="app"
onclick="openApp('https://web.whatsapp.com')">
💬 WhatsApp
</button>

<button class="app"
onclick="openApp('https://x.com')">
𝕏 X
</button>

<button class="app"
onclick="openApp('https://www.linkedin.com')">
💼 LinkedIn
</button>

<button class="app"
onclick="openApp('https://www.netflix.com')">
🎬 Netflix
</button>

<button class="app"
onclick="openApp('https://open.spotify.com')">
🎧 Spotify
</button>

<button class="app"
onclick="openApp('https://www.amazon.com')">
🛒 Amazon
</button>

<button class="app"
onclick="openApp('https://www.google.com')">
🔎 Google
</button>

<script>

Telegram.WebApp.ready();
Telegram.WebApp.expand();

function openApp(url) {

  /*
   * Navigate the current Mini App webview
   * instead of using an iframe.
   */
  window.location.href = url;

}

</script>

</body>
</html>
